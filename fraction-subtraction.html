<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมลบเศษส่วน</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#ffb6d9,#9be7ff,#fff0a6);
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* พื้นหลัง */

.circle{
    position:absolute;
    border-radius:50%;
    opacity:.3;
}

.c1{
    width:250px;
    height:250px;
    background:#ff7eb6;
    top:-80px;
    left:-80px;
}

.c2{
    width:300px;
    height:300px;
    background:#7ed6ff;
    bottom:-100px;
    right:-100px;
}

.c3{
    width:200px;
    height:200px;
    background:#fff59e;
    bottom:60px;
    left:50px;
}

/* กล่องหลัก */

.container{
    width:95%;
    height:95vh;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(10px);
    border-radius:40px;
    padding:25px;
    position:relative;
}

/* ด้านบน */

.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.timer{
    width:170px;
    height:170px;
    background:white;
    border-radius:50%;
    border:8px solid #6f59ff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.timer h1{
    font-size:65px;
    color:#6f59ff;
}

.timer p{
    font-size:24px;
}

.score{
    background:white;
    padding:25px 45px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.score h1{
    font-size:65px;
    color:#2b7cff;
}

.score p{
    font-size:28px;
    font-weight:bold;
}

/* ข้อ */

.question-number{
    background:white;
    padding:15px 40px;
    border-radius:25px;
    font-size:45px;
    font-weight:bold;
    box-shadow:0 10px 20px rgba(0,0,0,.1);
}

/* พื้นที่เกม */

.game-area{
    margin-top:25px;
    display:flex;
    gap:25px;
    height:70%;
}

/* กล่องโจทย์ */

.question-card{
    flex:1;
    background:white;
    border-radius:35px;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 12px 30px rgba(0,0,0,.12);
    position:relative;
}

.question{
    font-size:110px;
    color:#0d1b4c;
    font-weight:bold;
}

/* เศษส่วน */

.fraction{
    display:inline-block;
    text-align:center;
    vertical-align:middle;
    margin:0 15px;
    position:relative;
    min-width:120px;
}

.top-num{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:110px;
    border-bottom:7px solid #0d1b4c;
    padding:0 20px 10px;
}

.bottom-num{
    display:block;
    padding-top:10px;
}

/* คำตอบ */

.answer-box{
    min-width:120px;
    min-height:100px;
    border:5px solid #32c24d;
    border-radius:25px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#32c24d;
}

/* ถูกต้อง */

.correct-label{
    position:absolute;
    top:-85px;
    left:50%;
    transform:translateX(-50%);
    background:#32c24d;
    color:white;
    padding:12px 28px;
    border-radius:20px;
    font-size:32px;
    font-weight:bold;
    display:none;
    white-space:nowrap;
    box-shadow:0 8px 18px rgba(50,194,77,.35);
    animation:pop .3s ease;
}

@keyframes pop{
    from{
        opacity:0;
        transform:translateX(-50%) scale(.5);
    }
    to{
        opacity:1;
        transform:translateX(-50%) scale(1);
    }
}

/* ด้านขวา */

.right-side{
    width:430px;
    display:flex;
    flex-direction:column;
    gap:20px;
}

/* ปุ่มตัวเลข */

.keypad{
    flex:1;
    background:#fff9d8;
    border-radius:35px;
    padding:25px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    box-shadow:0 12px 30px rgba(0,0,0,.12);
}

.key{
    background:white;
    border:none;
    border-radius:25px;
    font-size:60px;
    font-weight:bold;
    color:#0d1b4c;
    cursor:pointer;
    box-shadow:0 6px 15px rgba(0,0,0,.08);
    transition:.15s;
}

.key:hover{
    transform:scale(1.05);
}

.zero{
    grid-column:1/3;
}

.delete{
    background:#ff5d95;
    color:white;
}

/* ปุ่มตอบ */

.answer-btn{
    height:100px;
    border:none;
    border-radius:30px;
    background:linear-gradient(135deg,#58a9ff,#286dff);
    color:white;
    font-size:42px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(40,109,255,.35);
}

/* จบเกม */

.result{
    position:absolute;
    inset:0;
    background:rgba(255,255,255,.95);
    border-radius:40px;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:100;
}

.result h1{
    font-size:80px;
    color:#2b7cff;
    margin-bottom:20px;
}

.result p{
    font-size:45px;
    margin-bottom:35px;
}

.restart{
    padding:22px 65px;
    border:none;
    border-radius:30px;
    background:linear-gradient(135deg,#ff76ab,#ff4d8d);
    color:white;
    font-size:35px;
    cursor:pointer;
}

@media(max-width:1100px){

    .game-area{
        flex-direction:column;
    }

    .right-side{
        width:100%;
    }

    .question{
        font-size:70px;
    }

    .key{
        height:90px;
        font-size:45px;
    }

    .correct-label{
        font-size:24px;
        top:-70px;
    }
}

</style>
</head>

<body>

<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>

<div class="container">

    <div class="top">

        <div class="timer">
            <h1 id="time">10</h1>
            <p>วินาที</p>
        </div>

        <div class="question-number">
            ข้อ <span id="current">1</span> / 10
        </div>

        <div class="score">
            <h1 id="score">0</h1>
            <p>คะแนน</p>
        </div>

    </div>

    <div class="game-area">

        <div class="question-card">

            <div class="question" id="question"></div>

        </div>

        <div class="right-side">

            <div class="keypad">

                <button class="key" onclick="addNumber(1)">1</button>
                <button class="key" onclick="addNumber(2)">2</button>
                <button class="key" onclick="addNumber(3)">3</button>

                <button class="key" onclick="addNumber(4)">4</button>
                <button class="key" onclick="addNumber(5)">5</button>
                <button class="key" onclick="addNumber(6)">6</button>

                <button class="key" onclick="addNumber(7)">7</button>
                <button class="key" onclick="addNumber(8)">8</button>
                <button class="key" onclick="addNumber(9)">9</button>

                <button class="key zero" onclick="addNumber(0)">0</button>

                <button class="key delete" onclick="deleteNumber()">⌫</button>

            </div>

            <button class="answer-btn" onclick="checkAnswer()">
                ตอบ
            </button>

        </div>

    </div>

    <div class="result" id="result">

        <h1 id="resultTitle"></h1>

        <p id="finalScore"></p>

        <button class="restart" onclick="restartGame()">
            เริ่มใหม่
        </button>

    </div>

</div>

<script>

let currentQuestion = 1;
let score = 0;
let time = 10;
let timer;

let numerator1;
let numerator2;
let denominator;
let correctAnswer;

let userAnswer = '';

function generateQuestion(){

    denominator = Math.floor(Math.random()*8)+2;

    numerator1 = Math.floor(Math.random()*(denominator-1))+2;
    numerator2 = Math.floor(Math.random()*numerator1)+1;

    if(numerator2 >= numerator1){
        numerator2 = numerator1 - 1;
    }

    correctAnswer = numerator1 - numerator2;

    userAnswer = '';

    updateQuestion();

    document.getElementById("current").innerText = currentQuestion;

    startTimer();
}

function updateQuestion(){

    document.getElementById("question").innerHTML = `

    <span class="fraction">
        <span class="top-num">${numerator1}</span>
        <span class="bottom-num">${denominator}</span>
    </span>

    −

    <span class="fraction">
        <span class="top-num">${numerator2}</span>
        <span class="bottom-num">${denominator}</span>
    </span>

    =

    <span class="fraction">

        <div class="correct-label" id="correctLabel">
            ✔ ถูกต้อง
        </div>

        <span class="top-num">
            <span class="answer-box">
                ${userAnswer || '?'}
            </span>
        </span>

        <span class="bottom-num">${denominator}</span>

    </span>

    `;
}

function addNumber(num){

    if(userAnswer.length >= 2) return;

    userAnswer += num;

    updateQuestion();
}

function deleteNumber(){

    userAnswer = userAnswer.slice(0,-1);

    updateQuestion();
}

function startTimer(){

    clearInterval(timer);

    time = 10;

    document.getElementById("time").innerText = time;

    timer = setInterval(()=>{

        time--;

        document.getElementById("time").innerText = time;

        if(time <= 0){

            clearInterval(timer);

            endGame(false);

        }

    },1000);
}

function checkAnswer(){

    if(parseInt(userAnswer) === correctAnswer){

        clearInterval(timer);

        score++;

        document.getElementById("score").innerText = score;

        document.getElementById("correctLabel").style.display = "block";

        setTimeout(()=>{

            if(currentQuestion >= 10){

                endGame(true);

            }else{

                currentQuestion++;

                generateQuestion();

            }

        },1200);

    }else{

        endGame(false);

    }
}

function endGame(success){

    clearInterval(timer);

    document.getElementById("result").style.display = "flex";

    if(success){

        document.getElementById("resultTitle").innerText =
        "🎉 ภารกิจสำเร็จ";

    }else{

        document.getElementById("resultTitle").innerText =
        "❌ เกมจบแล้ว";

    }

    document.getElementById("finalScore").innerText =
    `คุณได้ ${score} / 10 คะแนน`;

}

function restartGame(){

    currentQuestion = 1;
    score = 0;

    document.getElementById("score").innerText = 0;

    document.getElementById("result").style.display = "none";

    generateQuestion();
}

generateQuestion();

</script>

</body>
</html>
